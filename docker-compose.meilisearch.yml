services:
  dev_dataverse:
    # environment:
    #   DATAVERSE_SEARCH_DEFAULT_SERVICE: "${DATAVERSE_SEARCH_DEFAULT_SERVICE:-solr}"
    #   DATAVERSE_SEARCH_MEILISEARCH_URL: http://dev_meilisearch:7700
    #   DATAVERSE_SEARCH_MEILISEARCH_API_KEY: "${MEILISEARCH_API_KEY:-dataverse-test-master-key}"
    #   DATAVERSE_SEARCH_MEILISEARCH_INDEX_API_KEY: "${MEILISEARCH_API_KEY:-dataverse-test-master-key}"
    #   DATAVERSE_SEARCH_MEILISEARCH_INDEX: "${MEILISEARCH_INDEX:-zbdocs}"
    #   DATAVERSE_SEARCH_MEILISEARCH_EMBEDDER: "${DATAVERSE_SEARCH_MEILISEARCH_EMBEDDER:-}"
    #   DATAVERSE_SEARCH_MEILISEARCH_SEMANTIC_RATIO: "${DATAVERSE_SEARCH_MEILISEARCH_SEMANTIC_RATIO:-0.5}"

    environment:
      DATAVERSE_SEARCH_MEILISEARCH_API_KEY: "${MEILISEARCH_API_KEY:-dataverse-test-master-key}"
      DATAVERSE_SEARCH_MEILISEARCH_INDEX_API_KEY: "${MEILISEARCH_API_KEY:-dataverse-test-master-key}"
      DATAVERSE_SEARCH_MEILISEARCH_URL: http://dev_meilisearch:7700
      DATAVERSE_SEARCH_MEILISEARCH_EMBEDDER: "${DATAVERSE_SEARCH_MEILISEARCH_EMBEDDER:-qwen3-embedding:8b}"
      DATAVERSE_SEARCH_MEILISEARCH_EMBEDDER_DIMENSIONS: "${MEILISEARCH_EMBEDDER_DIMENSIONS:-4096}"
      DATAVERSE_SEARCH_MEILISEARCH_EMBEDDER_MODEL: "${MEILISEARCH_EMBEDDER_MODEL:-qwen3-embedding:8b}"
      DATAVERSE_SEARCH_MEILISEARCH_EMBEDDER_URL: "${MEILISEARCH_EMBEDDER_URL:-http://10.0.7.20:11435/api/embed}"
      DATAVERSE_SEARCH_MEILISEARCH_INDEX: "${MEILISEARCH_INDEX:-zbdocs}"
    depends_on:
      dev_meilisearch:
        condition: service_healthy
      dev_meilisearch_initializer:
        condition: service_completed_successfully

  dev_meilisearch:
    image: getmeili/meilisearch:v1.53.1
    environment:
      MEILI_MASTER_KEY: "${MEILISEARCH_API_KEY:-dataverse-test-master-key}"
      MEILI_EXPERIMENTAL_ALLOWED_IP_NETWORKS: "10.0.7.20/32"
      MEILISEARCH_API_KEY: "${MEILISEARCH_API_KEY:-dataverse-test-master-key}"
      MEILISEARCH_EMBEDDER: "${DATAVERSE_SEARCH_MEILISEARCH_EMBEDDER:-qwen3-embedding:8b}"
      MEILISEARCH_EMBEDDER_DIMENSIONS: "${MEILISEARCH_EMBEDDER_DIMENSIONS:-4096}"
      MEILISEARCH_EMBEDDER_MODEL: "${MEILISEARCH_EMBEDDER_MODEL:-qwen3-embedding:8b}"
      MEILISEARCH_EMBEDDER_URL: "${MEILISEARCH_EMBEDDER_URL:-http://10.0.7.20:11435/api/embed}"
      MEILI_EXPERIMENTAL_REST_EMBEDDER_TIMEOUT_SECONDS: "120"
      MEILISEARCH_INDEX: "${MEILISEARCH_INDEX:-zbdocs}"
    ports:
      - "127.0.0.1:${MEILISEARCH_PORT:-17700}:7700"
    networks:
      - dataverse
    volumes:
      - dev_meilisearch_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  dev_meilisearch_initializer:
    image: getmeili/meilisearch:v1.53.1
    entrypoint: ["/bin/sh", "/usr/local/bin/init-meilisearch.sh"]
    environment:
      MEILISEARCH_API_KEY: "${MEILISEARCH_API_KEY:-dataverse-test-master-key}"
      MEILISEARCH_EMBEDDER: "${DATAVERSE_SEARCH_MEILISEARCH_EMBEDDER:-qwen3-embedding:8b}"
      MEILISEARCH_EMBEDDER_DIMENSIONS: "${MEILISEARCH_EMBEDDER_DIMENSIONS:-4096}"
      MEILISEARCH_EMBEDDER_MODEL: "${MEILISEARCH_EMBEDDER_MODEL:-qwen3-embedding:8b}"
      MEILISEARCH_EMBEDDER_URL: "${MEILISEARCH_EMBEDDER_URL:-http://10.0.7.20:11435/api/embed}"
      MEILISEARCH_INDEX: "${MEILISEARCH_INDEX:-zbdocs}"
    networks:
      - dataverse
    volumes:
      - ./conf/meilisearch/settings.json:/etc/meilisearch/settings.json:ro
      - ./scripts/dev/init-meilisearch.sh:/usr/local/bin/init-meilisearch.sh:ro
    depends_on:
      dev_meilisearch:
        condition: service_healthy
    restart: "no"

volumes:
  dev_meilisearch_data:
